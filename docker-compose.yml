services:

  # ── Aplikasi Laravel (PHP-FPM) ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-base
    container_name: eadmin_app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    env_file:
      - .env
    volumes:
      - storage_private:/var/www/html/storage/app/private
      - public_icons:/var/www/html/public/icons
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eadmin_net

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: eadmin_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - nginx_ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - eadmin_net

  # ── MySQL ───────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: eadmin_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-eadmin}
      MYSQL_USER: ${DB_USERNAME:-eadmin}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eadmin_net

  # ── Redis (cache & session) ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eadmin_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - eadmin_net

  # ── Queue Worker ────────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-base
    container_name: eadmin_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    volumes:
      - storage_private:/var/www/html/storage/app/private
      - public_icons:/var/www/html/public/icons
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eadmin_net

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  db_data:
  redis_data:
  storage_private:
  public_icons:
  nginx_ssl:

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  eadmin_net:
    driver: bridge
